# 部署说明：
# 1. 商城前端目录：/var/1bossshop
# 2. 后台前端目录：/var/1bossadmin
# 3. 流量后台前端目录：/var/1admin-liuliang
# 4. Node API 服务：127.0.0.1:3110，通常由 pm2 管理
# 5. 商城域名：https://wenshuosc.com/
# 6. 后台域名：https://admin.wenshuosc.com/
# 7. 流量后台：http://服务器公网IP:8081/
# 8. 替换配置后执行：nginx -t && systemctl reload nginx
# 9. 如果 /etc/nginx/conf.d/default.conf 中存在 default_server，请禁用，避免冲突
# 10. 哆点点要求接口不能带 /api，因此单独把 /market/halfFlow/447285613150998528/open/ 转发到后端

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 15m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript application/xml+rss application/xml text/xml;

    include /etc/nginx/conf.d/*.conf;

    # 端口 80 仅继续承载明确的商城、支付和合作方 API；其余 /api 请求一律转后台 HTTPS。
    map "$request_method:$uri" $admin_plain_http_https {
        default 1;
        ~^(?:GET|HEAD|OPTIONS):/api/(?:health|geocode/reverse)$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/products(?:/[^/]+)?$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/static/ 0;
        ~^(?:POST|OPTIONS):/api/auth/(?:register/sms/send|login/sms/send|register|login)$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/users/by-phone$ 0;
        ~^(?:POST|OPTIONS):/api/orders$ 0;
        ~^(?:POST|OPTIONS):/api/mall/(?:me/emergency-contacts|installment-risk/wave(?:/[^/]+/step/[^/]+)?)$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/mall/(?:me/bill-risk|contacts/status|contract-pending|cs/session)$ 0;
        ~^(?:POST|OPTIONS):/api/mall/contacts/upload/(?:start|batch|complete)$ 0;
        ~^(?:POST|OPTIONS):/api/mall/cs/(?:session/open|messages(?:/image)?)$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/my/(?:summary|orders)$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/card-packages(?:/[^/]+/(?:contract-view|contract-flow))?$ 0;
        ~^(?:POST|OPTIONS):/api/card-packages/[^/]+/(?:contract-ack|contract-sign-reset)$ 0;
        ~^(?:GET|HEAD|POST|OPTIONS):/api/addresses$ 0;
        ~^(?:PATCH|OPTIONS):/api/addresses/[^/]+(?:/default)?$ 0;
        ~^(?:GET|HEAD|POST|OPTIONS):/api/bank-cards$ 0;
        ~^(?:DELETE|OPTIONS):/api/bank-cards/[^/]+$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/bills$ 0;
        ~^(?:POST|OPTIONS):/api/bills/(?:repay|repay-negotiated)$ 0;
        ~^(?:POST|OPTIONS):/api/payment/lakala/(?:preorder|sync-pending|mock-complete/[^/]+|notify)$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/payment/lakala/(?:status/[^/]+|config)$ 0;
        ~^(?:POST|OPTIONS):/api/ios/(?:auth/register(?:/sms/send)?|uploads/id-card|installment-risk/wave(?:/[^/]+/step/[^/]+)?|installment/orders|orders/[^/]+/contacts/upload/(?:start|batch|complete)|account/delete)$ 0;
        ~^(?:PUT|OPTIONS):/api/ios/installment/profile$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/ios/(?:installment/profile|account/deletion-eligibility)$ 0;
        ~^(?:POST|OPTIONS):/api/(?:bill-risk/callback|uploads/id-card|traffic/channel-click)$ 0;
        ~^(?:POST|OPTIONS):/api/traffic-partner/login$ 0;
        ~^(?:GET|HEAD|OPTIONS):/api/traffic-partner/stats$ 0;
        ~^(?:POST|OPTIONS):/api/open/partners/[^/]+/(?:admission|contracts|credit/(?:apply|query)|app/link|login/consume|apply|checkPrefix|checkPrefIx|contractQuery|getUrl|order/(?:status|bindCard|replayPlan|replay|sign)/notify)$ 0;
        ~^(?:POST|OPTIONS):/api/market/halfFlow/[^/]+/open/(?:checkPrefix|checkPrefIx|contractQuery|apply|login/consume|getUrl|order/(?:status|bindCard|replayPlan|replay|sign)/notify)$ 0;
    }

    # 后台不再做 Nginx IP 白名单限制，访问控制交由后台登录与接口鉴权处理。
    # ========== IP 访问：商城 + API，端口 80 ==========
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        location /api/ {

            if ($admin_plain_http_https) {
                return 308 https://admin.wenshuosc.com$request_uri;
            }

            proxy_pass         http://127.0.0.1:3110/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /risk-api/ {
            proxy_pass         http://127.0.0.1:3110/risk-api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /static/ {
            proxy_pass         http://127.0.0.1:3110/static/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location / {
            root  /var/1bossshop;
            try_files $uri /index.html;
        }

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ========== 商城域名 HTTP 跳转 HTTPS，保留 Certbot 验证 ==========
    server {
        listen       80;
        listen       [::]:80;
        server_name  wenshuosc.com www.wenshuosc.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            allow all;
        }

        location ^~ /market/halfFlow/447285613150998528/open/ {
            proxy_pass         http://127.0.0.1:3110/market/halfFlow/447285613150998528/open/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========== 后台域名 HTTP 跳转 HTTPS，保留 Certbot 验证 ==========
    server {
        listen       80;
        listen       [::]:80;
        server_name  admin.wenshuosc.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            allow all;
        }

        location / {

            return 301 https://$host$request_uri;
        }
    }

    # ========== 商城 HTTPS：wenshuosc.com + www ==========
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  wenshuosc.com www.wenshuosc.com;

        ssl_certificate     /etc/letsencrypt/live/wenshuosc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wenshuosc.com/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # 哆点点专属接口：他们要求不能带 /api，所以这里单独转发到后端。
        location ^~ /market/halfFlow/447285613150998528/open/ {
            proxy_pass         http://127.0.0.1:3110/market/halfFlow/447285613150998528/open/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /api/ {

            proxy_pass         http://127.0.0.1:3110/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /risk-api/ {
            proxy_pass         http://127.0.0.1:3110/risk-api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /static/ {
            proxy_pass         http://127.0.0.1:3110/static/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location / {
            root  /var/1bossshop;
            try_files $uri /index.html;
        }

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ========== 后台 HTTPS：admin.wenshuosc.com ==========
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  admin.wenshuosc.com;

        ssl_certificate     /etc/letsencrypt/live/wenshuosc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wenshuosc.com/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        location / {

            root  /var/1bossadmin;
            try_files $uri /index.html;
        }
    }

    # ========== 后台 SPA 备用：端口 8080 ==========
    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        return 301 https://admin.wenshuosc.com$request_uri;
    }

    # ========== 流量后台 SPA：端口 8081 ==========
    server {
        listen       8081;
        listen       [::]:8081;
        server_name  _;

        location /api/ {

            proxy_pass         http://127.0.0.1:3110/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /risk-api/ {
            proxy_pass         http://127.0.0.1:3110/risk-api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location /static/ {
            proxy_pass         http://127.0.0.1:3110/static/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
        }

        location / {
            root  /var/1admin-liuliang;
            try_files $uri /index.html;
        }
    }
}
